<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>J.A.R.V.I.S. // STARK OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #0d1522 0%, #020408 100%);
      color: #ffae00;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    .hud-layer {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; padding: 24px;
    }
    .top-bar, .bottom-bar { display: flex; justify-content: space-between; align-items: center; }
    .panel {
      background: rgba(10, 18, 30, 0.65);
      border: 1px solid rgba(255, 174, 0, 0.35);
      box-shadow: 0 0 15px rgba(255, 174, 0, 0.15);
      padding: 12px 18px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; letter-spacing: 4px; color: #ffae00; }
    .cyan { color: #00e5ff; }
    
    /* Engine Select Dropdown Styling */
    .engine-select {
      background: rgba(255, 174, 0, 0.15);
      border: 1px solid #ffae00;
      color: #ffae00;
      padding: 8px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      outline: none;
      transition: 0.2s;
    }
    .engine-select option {
      background: #0d1522;
      color: #ffae00;
    }
    .engine-select.local-active {
      background: rgba(0, 229, 255, 0.15);
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .controls { display: flex; gap: 10px; width: 100%; max-width: 750px; margin: 0 auto; pointer-events: auto; }
    input {
      flex: 1; background: rgba(5, 10, 18, 0.85); border: 1px solid rgba(255, 174, 0, 0.5);
      color: #fff; padding: 12px 16px; font-family: 'Share Tech Mono', monospace; font-size: 15px; outline: none;
    }
    button.action {
      background: #ffae00; color: #000; border: none; padding: 0 20px;
      font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer;
    }
    button.mic-btn { background: transparent; border: 1px solid #00e5ff; color: #00e5ff; }
    button.mic-btn.listening { background: #00e5ff; color: #000; box-shadow: 0 0 20px #00e5ff; }
    #subtitle {
      text-align: center; font-size: 16px; color: #ffe6b3; max-width: 800px;
      margin: 0 auto 14px auto; text-shadow: 0 0 8px rgba(255, 174, 0, 0.6); min-height: 24px;
    }
    .stat-row { font-size: 13px; margin: 4px 0; color: #00e5ff; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-layer">
    <div class="top-bar">
      <div class="panel">
        <h1>J.A.R.V.I.S. // ULTRON MATRIX</h1>
        <div style="font-size:12px; margin-top:4px;">ACTIVE ENGINE: <span id="active-engine" class="cyan">STANDBY</span></div>
      </div>
      <div class="panel" style="text-align:right;">
        <!-- Manual Multi-Engine Selector Dropdown -->
        <select id="engineSelect" class="engine-select" onchange="changeEngine(this.value)">
          <option value="jarvis-cloud">ENGINE: GROQ CLOUD (GPT-OSS)</option>
          <option value="gemini-model">ENGINE: GEMINI FLASH (3.8)</option>
          <option value="jarvis-local">ENGINE: LOCAL OLLAMA</option>
        </select>
        <div class="stat-row" id="sysStats" style="margin-top: 6px;">CPU: --% | RAM: --% | PWR: --%</div>
      </div>
    </div>

    <div>
      <div id="subtitle">Neural matrix online. Select engine, click MIC or type directive, Sir.</div>
      <div class="controls">
        <button id="micBtn" class="action mic-btn" onclick="toggleMic()">MIC OFF</button>
        <input type="text" id="cmdInput" placeholder="Enter directive for J.A.R.V.I.S..." onkeydown="if(event.key==='Enter') sendCmd()">
        <button class="action" onclick="sendCmd()">EXECUTE</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Three.js Stark OS Hologram Core
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const geo1 = new THREE.IcosahedronGeometry(1.7, 3);
    const mat1 = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.45 });
    const outerSphere = new THREE.Mesh(geo1, mat1);
    scene.add(outerSphere);

    const geo2 = new THREE.IcosahedronGeometry(1.05, 2);
    const mat2 = new THREE.MeshBasicMaterial({ color: 0xff5500, wireframe: true, transparent: true, opacity: 0.85 });
    const innerCore = new THREE.Mesh(geo2, mat2);
    scene.add(innerCore);

    const pGeo = new THREE.BufferGeometry();
    const pCount = 900;
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 4.5;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0xffcc33, size: 0.025, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    let isSpeaking = false;
    function animate() {
      requestAnimationFrame(animate);
      const pulse = isSpeaking ? 1 + Math.sin(Date.now() * 0.02) * 0.18 : 1 + Math.sin(Date.now() * 0.003) * 0.04;
      outerSphere.rotation.y += 0.004;
      outerSphere.rotation.x += 0.002;
      outerSphere.scale.set(pulse, pulse, pulse);
      innerCore.rotation.y -= 0.008;
      innerCore.scale.set(pulse * 0.95, pulse * 0.95, pulse * 0.95);
      particles.rotation.y += 0.0015;
      renderer.render(scene, camera);
    }
    animate();

    // Engine Switching Logic
    let currentMode = "jarvis-cloud";
    function changeEngine(modelName) {
      currentMode = modelName;
      const selectElem = document.getElementById('engineSelect');
      
      if (modelName === "jarvis-local") {
        selectElem.classList.add("local-active");
        mat1.color.setHex(0x00e5ff);
        speak("Local offline protocol engaged, Sir.");
      } else if (modelName === "gemini-model") {
        selectElem.classList.remove("local-active");
        mat1.color.setHex(0x4285F4); // Google Blue accent
        speak("Google Gemini cloud matrix engaged, Sir.");
      } else {
        selectElem.classList.remove("local-active");
        mat1.color.setHex(0xffaa00); // Stark Gold accent
        speak("Groq cloud primary matrix engaged, Sir.");
      }
    }

    function speak(text) {
      document.getElementById('subtitle').innerText = text;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const ukVoice = voices.find(v => v.lang.includes('en-GB') && v.name.includes('Male')) || voices.find(v => v.lang.includes('en-GB'));
      if (ukVoice) utter.voice = ukVoice;
      utter.pitch = 0.95;
      utter.rate = 1.05;
      utter.onstart = () => { isSpeaking = true; };
      utter.onend = () => { isSpeaking = false; };
      window.speechSynthesis.speak(utter);
    }

    let recognition;
    let micActive = false;
    if ('webkitSpeechRecognition' in window) {
      recognition = new webkitSpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onresult = (e) => {
        const transcript = e.results[e.results.length - 1][0].transcript.trim();
        document.getElementById('subtitle').innerText = "YOU: " + transcript;
        sendCmd(transcript);
      };
      recognition.onend = () => { if (micActive) recognition.start(); };
    }

    function toggleMic() {
      const btn = document.getElementById('micBtn');
      if (!micActive) {
        micActive = true;
        recognition.start();
        btn.innerText = "LISTENING";
        btn.classList.add("listening");
      } else {
        micActive = false;
        recognition.stop();
        btn.innerText = "MIC OFF";
        btn.classList.remove("listening");
      }
    }

    async function sendCmd(voiceText = null) {
      const input = document.getElementById('cmdInput');
      const msg = voiceText || input.value.trim();
      if (!msg) return;
      input.value = "";
      document.getElementById('subtitle').innerText = "PROCESSING DIRECTIVE...";
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, mode: currentMode })
        });
        const data = await res.json();
        document.getElementById('active-engine').innerText = data.model_used.toUpperCase();
        speak(data.reply);
      } catch (err) {
        speak("Unable to reach neural server, Sir.");
      }
    }

    setInterval(async () => {
      try {
        const res = await fetch('/stats');
        const s = await res.json();
        document.getElementById('sysStats').innerText = `CPU: ${s.cpu}% | RAM: ${s.ram}% | PWR: ${s.battery}%`;
      } catch {}
    }, 3000);
  </script>
</body>
</html>
